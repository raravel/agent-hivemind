[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hivemind"
version = "2.0.0"
description = "Agent Hivemind CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.scripts]
hv = "hivemind.__main__:cli"
hivemind = "hivemind.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true
