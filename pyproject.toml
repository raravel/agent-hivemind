[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hivemind"
version = "5.1.0"
description = "Harness engineering toolkit for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "raravel" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/raravel/agent-hivemind"
Repository = "https://github.com/raravel/agent-hivemind"

[project.scripts]
hv = "hivemind.__main__:cli"
hivemind = "hivemind.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hivemind/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "questionary"
ignore_missing_imports = true
